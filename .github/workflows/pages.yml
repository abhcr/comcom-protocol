name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run check:generated
      - run: npm run check:v0.2
      - run: npm run check:v0.2.1
      - run: npm run check:site
      - run: npm run verify:release
      - run: npm run verify:site
      - run: npm test
      - run: npm run conformance:v0.2
      - name: Assemble GitHub Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/releases/v0.2.0/profiles _site/releases/v0.2.0/schemas
          cp -R docs/. _site/
          cp -R schemas registry spec examples releases profiles _site/
          cp -R profiles/v0.2 _site/releases/v0.2.0/profiles/v0.2
          cp -R schemas/v0.2/. _site/releases/v0.2.0/schemas/

          mkdir -p _release_assets
          gh release download v0.2.0 --dir _release_assets
          echo "82b0d547d2e68250f9202dbd77d47a336e4a9319b518e5a7564b8b77e97f5ad4  _release_assets/release-manifest.json" | sha256sum --check --strict
          while IFS=$'\t' read -r asset_path expected_sha; do
            source="_release_assets/${asset_path##*/}"
            target="_site/releases/v0.2.0/$asset_path"
            echo "$expected_sha  $source" | sha256sum --check --strict
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
          done < <(jq -r '.files[] | [.path, .sha256] | @tsv' _release_assets/release-manifest.json)
          cp _release_assets/release-manifest.json _site/releases/v0.2.0/release-manifest.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
