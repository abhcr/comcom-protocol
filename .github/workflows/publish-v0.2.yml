name: Publish Comcom release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to test and publish
        required: true
        type: choice
        options: [v0.2.1]

permissions:
  contents: write

concurrency:
  group: comcom-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify exact tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm audit --audit-level=moderate
      - run: npm run check:generated
      - run: npm run check:v0.2
      - run: npm run check:v0.2.1
      - run: npm run check:site
      - run: npm run verify:release
      - run: npm run verify:site
      - run: npm test
      - run: npm run conformance:v0.2
      - run: npm run demo:v0.2
      - name: Publish tested immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; assets will not be replaced."
            exit 1
          fi
          npm run package:release -- "$RELEASE_TAG"
          { cat releases/v0.2.1/README.md; printf '\nTested source commit: %s\n' "$(git rev-parse HEAD)"; } > dist/release-notes.md
          mapfile -d '' assets < <(find "dist/$RELEASE_TAG" -type f -print0 | sort -z)
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse 'FETCH_HEAD^{commit}')"
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --prerelease \
            --title "Comcom v0.2.1 — Experimental discovery publishers" --notes-file dist/release-notes.md
